<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(to right,#4facfe,#00f2fe);
}

.box{
background:white;
padding:30px;
width:400px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.3);
}

h1{
text-align:center;
margin-bottom:20px;
}

.field{
margin-bottom:15px;
}

label{
display:block;
margin-bottom:5px;
font-weight:bold;
}

input{
width:100%;
padding:10px;
border:1px solid gray;
border-radius:5px;
}

button{
width:100%;
padding:12px;
background:blue;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:darkblue;
}

.signup{
text-align:center;
margin-top:15px;
}

.signup a{
text-decoration:none;
color:blue;
font-weight:bold;
}

.error{
color:red;
text-align:center;
margin-bottom:10px;
}

</style>

</head>

<body>

<div class="box">

<h1>Login</h1>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="POST">

{% csrf_token %}

<div class="field">

<label>Email</label>

<input
type="email"
name="email"
required>

</div>

<div class="field">

<label>Password</label>

<input
type="password"
name="password"
required>

</div>

<button type="submit">
Login
</button>

<div class="signup">
Don't have an account?
<a href="{% url 'signup' %}">
Sign Up
</a>
</div>

</form>

</div>

</body>
</html>
