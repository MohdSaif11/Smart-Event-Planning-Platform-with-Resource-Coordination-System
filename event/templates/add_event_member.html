{% extends 'base.html' %}

{% block title %}Add Event Member{% endblock %}

{% block content %}

<div class="page-heading">

    <h1>Add Event Member</h1>

    <div class="breadcrumbs">
        <a href="{% url 'admin_panel' %}">Home</a>
        /
        <span>Add Event Member</span>
    </div>

</div>

<div class="form-page-container">

    <div class="form-card">

        <h2>Add Event Member</h2>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>Name</label>

                <input type="text"
                       name="name"
                       required>

            </div>

            <div class="form-group">

                <label>Email</label>

                <input type="email"
                       name="email"
                       required>

            </div>

            <div class="form-group">

                <label>Phone</label>

                <input type="text"
                       name="phone"
                       maxlength="10"
                       required>

            </div>

            <div class="form-group">

                <label>College</label>

                <input type="text"
                       name="college"
                       required>

            </div>

            <div class="form-group">

                <label>Select Event</label>

                <select name="event" required>

                    <option value="">Select Event</option>

                    {% for event in events %}

                    <option value="{{ event.id }}">
                        {{ event.event_name }}
                    </option>

                    {% endfor %}

                </select>

            </div>

            <button type="submit" class="submit-btn">
                Add Member
            </button>

        </form>

    </div>

</div>

{% endblock %}
