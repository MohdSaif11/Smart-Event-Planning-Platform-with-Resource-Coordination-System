{% extends "base.html" %}

{% block title %}Add Event Wish User{% endblock %}

{% block content %}

<div class="form-page">

    <div class="page-heading">

        <h1>Add Event Wish User</h1>

        <div class="breadcrumb">
            <a href="{% url 'home' %}">Home</a> / Add Event Wish User
        </div>

    </div>

    <div class="form-card">

        <div class="form-card-header">

            <h2>
                <i class="fa-solid fa-heart"></i>
                Add Event To Wish List
            </h2>

            <a href="{% url 'event_wish_list' %}" class="primary-btn">
                Wish List
            </a>

        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>
                    <i class="fa-solid fa-user"></i>
                    Name
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter Name"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    <i class="fa-solid fa-envelope"></i>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter Email"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    <i class="fa-solid fa-calendar-days"></i>
                    Select Event
                </label>

                <select name="event" required>

                    <option value="">Select Event</option>

                    {% for event in events %}

                    <option value="{{ event.id }}">
                        {{ event.event_name }}
                    </option>

                    {% endfor %}

                </select>

            </div>

            <button type="submit" class="form-submit-btn">
                <i class="fa-solid fa-heart"></i>
                Add To Wish List
            </button>

        </form>

    </div>

</div>

{% endblock %}
