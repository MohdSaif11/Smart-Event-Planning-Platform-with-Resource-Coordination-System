{% extends 'base.html' %}

{% block title %}Edit Event Member{% endblock %}

{% block content %}

<div class="page-heading">

    <h1>Edit Event Member</h1>

    <div class="breadcrumbs">
        <a href="{% url 'admin_panel' %}">Home</a>
        /
        <a href="{% url 'join_event_list' %}">Join Event List</a>
        /
        <span>Edit</span>
    </div>

</div>

<div class="form-page-container">

    <div class="form-card">

        <h2>Edit Event Member</h2>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>Name</label>

                <input type="text"
                       name="name"
                       value="{{ member.name }}"
                       required>

            </div>

            <div class="form-group">

                <label>Email</label>

                <input type="email"
                       name="email"
                       value="{{ member.email }}"
                       required>

            </div>

            <div class="form-group">

                <label>Phone</label>

                <input type="text"
                       name="phone"
                       maxlength="10"
                       value="{{ member.phone }}"
                       required>

            </div>

            <div class="form-group">

                <label>College</label>

                <input type="text"
                       name="college"
                       value="{{ member.college }}"
                       required>

            </div>

            <div class="form-group">

                <label>Event</label>

                <select name="event" required>

                    {% for event in events %}

                    <option value="{{ event.id }}"
                        {% if event.id == member.event.id %}selected{% endif %}>

                        {{ event.event_name }}

                    </option>

                    {% endfor %}

                </select>

            </div>

            <button type="submit" class="submit-btn">
                Update Member
            </button>

        </form>

    </div>

</div>

{% endblock %}
