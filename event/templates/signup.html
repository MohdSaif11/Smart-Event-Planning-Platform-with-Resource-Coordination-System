<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to right, skyblue, lightgreen);
        }

        .box {
            background: white;
            width: 550px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .error {
            color: red;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid gray;
            border-radius: 5px;
        }

        button {
            grid-column: 1/3;
            padding: 12px;
            background: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: darkblue;
        }

        .login {
            grid-column: 1/3;
            text-align: center;
        }

        .login a {
            text-decoration: none;
            color: blue;
            font-weight: bold;
        }

        .login a:hover {
            text-decoration: underline;
        }

        @media(max-width:600px) {

            .box {
                width: 90%;
            }

            form {
                grid-template-columns: 1fr;
            }

            button,
            .login {
                grid-column: 1;
            }

        }
    </style>

</head>

<body>

<div class="box">

    <h1>Sign Up</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="field">
            <label>Full Name</label>
            <input
                type="text"
                name="fullname"
                placeholder="Enter your full name"
                required
                minlength="3">
        </div>

        <div class="field">
            <label>Phone Number</label>
            <input
                type="tel"
                name="phone"
                placeholder="Enter your phone number"
                required
                pattern="[0-9]{10}">
        </div>
        <div class="field">
    <label>College</label>
    <input
        type="text"
        name="college"
        placeholder="Enter your college name"
        required>
</div>
        <div class="field">
            <label>Email</label>
            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required>
        </div>

        <div class="field">
            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
                minlength="8">
        </div>

        <div class="field">
            <label>Confirm Password</label>
            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm your password"
                required
                minlength="8">
        </div>
        <div class="field">
    <label>Role</label>

    <select name="role" required>
        <option value="">Select Role</option>
        <option value="user">User</option>
        <option value="admin">Admin</option>
    </select>
</div>

        <button type="submit">
            Sign Up
        </button>

        <div class="login">
            <p>
                Already have an account?
                <a href="{% url 'login' %}">
                    Login
                </a>
            </p>
        </div>

    </form>

</div>

</body>

</html>
